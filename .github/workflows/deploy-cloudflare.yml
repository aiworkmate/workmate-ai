name: deploy-cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - workmate-frontier-brain-starter
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.dev.vars.example'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_VISION_MODEL: ${{ secrets.OPENAI_VISION_MODEL }}
      AI_ENDPOINT_STYLE: ${{ secrets.AI_ENDPOINT_STYLE }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      VITE_BRAIN_API_BASE_URL: ${{ secrets.VITE_BRAIN_API_BASE_URL }}
      VITE_BRAIN_CHAT_URL: ${{ secrets.VITE_BRAIN_CHAT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Cloudflare runtime
        run: npm run build:cloudflare

      - name: Verify Wrangler config exists
        run: npm run check:cloudflare

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
